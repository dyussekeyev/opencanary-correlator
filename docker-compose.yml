name: opencanary-correlator

services:
  redis:
    # Digest resolved 2026-10-24 from the redis:7-alpine multi-arch index.
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    # The password has no default: compose refuses to start without it, so an
    # unauthenticated Redis is never brought up by accident.
    command:
      - redis-server
      - --requirepass
      - "${OCC_REDIS_PASSWORD:?set OCC_REDIS_PASSWORD in .env or the environment}"
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # redis-cli reads REDISCLI_AUTH, so the healthcheck and `docker compose exec`
    # authenticate without putting the password on a command line.
    environment:
      REDISCLI_AUTH: "${OCC_REDIS_PASSWORD:?set OCC_REDIS_PASSWORD in .env or the environment}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  correlator:
    build:
      context: .
    restart: unless-stopped
    # Optional `.env` supplies webhooks, SMTP, syslog and health settings. The
    # variables below take precedence, so the container always talks to the
    # bundled Redis instead of a URL copied from a host-oriented `.env`.
    env_file:
      - path: .env
        required: false
    environment:
      # Built from the same password as the Redis service. Use a URL-safe value
      # (letters, digits, `-` and `_`): the password is embedded in the URL unescaped.
      OCC_REDIS_URL: "redis://:${OCC_REDIS_PASSWORD:?set OCC_REDIS_PASSWORD in .env or the environment}@redis:6379/0"
      OCC_TCP_HOST: 0.0.0.0
      OCC_TCP_PORT: "1514"
      OCC_SYSLOG_HOST: 0.0.0.0
      OCC_SYSLOG_PORT: "5514"
      # Interface the probe listener binds to. The loopback default keeps the
      # listener and /metrics inside the container; export
      # OCC_HEALTH_HOST=0.0.0.0 (or set it in `.env`) only when an external probe needs it. The
      # image HEALTHCHECK dials
      # 127.0.0.1 for a wildcard binding, so either value stays healthy.
      OCC_HEALTH_HOST: "${OCC_HEALTH_HOST:-127.0.0.1}"
    # OCC_HEALTH_PORT is inherited from `.env`, so the listener and the image
    # HEALTHCHECK always agree; it stays container-internal because the probe
    # runs inside the container.
    # TCP and UDP are published for external canaries. Enable the listener with
    # OCC_SYSLOG_ENABLED=true, plus OCC_SYSLOG_UDP_ENABLED=true for UDP.
    ports:
      - "1514:1514"
      - "5514:5514/tcp"
      - "5514:5514/udp"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  redis-data:
