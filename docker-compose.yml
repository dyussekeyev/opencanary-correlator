name: opencanary-correlator

services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  correlator:
    build:
      context: .
    restart: unless-stopped
    # Optional `.env` supplies webhooks, SMTP and Telegram settings. The
    # variables below take precedence, so the container always talks to the
    # bundled Redis instead of a URL copied from a host-oriented `.env`.
    env_file:
      - path: .env
        required: false
    environment:
      OCC_REDIS_URL: redis://redis:6379/0
      OCC_TCP_HOST: 0.0.0.0
      OCC_TCP_PORT: "1514"
      OCC_SYSLOG_HOST: 0.0.0.0
      OCC_SYSLOG_PORT: "5514"
      OCC_HEALTH_PORT: "8080"
    ports:
      - "1514:1514"
    expose:
      - "5514/tcp"
      - "5514/udp"
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  redis-data:
