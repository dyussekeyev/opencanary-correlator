name: opencanary-correlator

services:
  redis:
    # Digest resolved 2026-10-24 from the redis:7-alpine multi-arch index.
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    # The password has no default: compose refuses to start without it, so an
    # unauthenticated Redis is never brought up by accident.
    command:
      - redis-server
      - --requirepass
      - "${OCC_REDIS_PASSWORD:?set OCC_REDIS_PASSWORD in .env or the environment}"
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # redis-cli reads REDISCLI_AUTH, so the healthcheck and `docker compose exec`
    # authenticate without putting the password on a command line.
    environment:
      REDISCLI_AUTH: "${OCC_REDIS_PASSWORD:?set OCC_REDIS_PASSWORD in .env or the environment}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  correlator:
    build:
      context: .
    restart: unless-stopped
    # Optional `.env` supplies webhooks, SMTP, syslog and health settings. The
    # variables below take precedence, so the container always talks to the
    # bundled Redis instead of a URL copied from a host-oriented `.env`.
    env_file:
      - path: .env
        required: false
    environment:
      # Built from the same password as the Redis service. Use a URL-safe value
      # (letters, digits, `-` and `_`): the password is embedded in the URL unescaped.
      OCC_REDIS_URL: "redis://:${OCC_REDIS_PASSWORD:?set OCC_REDIS_PASSWORD in .env or the environment}@redis:6379/0"
      # The receivers stay on the wildcard *inside* the container: Docker's port
      # mapping forwards to the container's bridge address, so a loopback
      # listener would be unreachable through the published port. The public
      # binding is narrowed below, in `ports:`.
      OCC_TCP_HOST: 0.0.0.0
      OCC_TCP_PORT: "${OCC_TCP_PORT:-15140}"
      OCC_SYSLOG_HOST: 0.0.0.0
      OCC_SYSLOG_PORT: "${OCC_SYSLOG_PORT:-15141}"
      # Interface the probe listener binds to. The loopback default keeps the
      # listener and /metrics inside the container; export
      # OCC_HEALTH_HOST=0.0.0.0 (or set it in `.env`) only when an external probe needs it. The
      # image HEALTHCHECK dials
      # 127.0.0.1 for a wildcard binding, so either value stays healthy.
      OCC_HEALTH_HOST: "${OCC_HEALTH_HOST:-127.0.0.1}"
      # Operational log file inside the mounted volume. The `-` form (not `:-`)
      # keeps an explicit empty value empty: `OCC_LOG_FILE=` in `.env` means
      # "stderr only" and does not fall back to the path below.
      OCC_LOG_FILE: "${OCC_LOG_FILE-/var/log/opencanary-correlator/logs/correlator.log}"
    # OCC_HEALTH_PORT is inherited from `.env` (default 15142), so the listener
    # and the image HEALTHCHECK always agree; it stays container-internal because
    # the probe runs inside the container.
    #
    # Intake is published on **loopback** by default: the canary usually runs on
    # this same host, and an intake port open on every interface is an
    # unauthenticated write path into the incident store. The publish address is
    # a variable, so widening it is a `.env` value that survives every compose
    # update instead of an edit to this file. Canaries on other machines need
    # OCC_TCP_PUBLISH_HOST=0.0.0.0 (and the syslog equivalent).
    # Enable the syslog entries with OCC_SYSLOG_ENABLED=true, plus
    # OCC_SYSLOG_UDP_ENABLED=true for UDP.
    ports:
      - "${OCC_TCP_PUBLISH_HOST:-127.0.0.1}:${OCC_TCP_PORT:-15140}:${OCC_TCP_PORT:-15140}"
      - "${OCC_SYSLOG_PUBLISH_HOST:-127.0.0.1}:${OCC_SYSLOG_PORT:-15141}:${OCC_SYSLOG_PORT:-15141}/tcp"
      - "${OCC_SYSLOG_PUBLISH_HOST:-127.0.0.1}:${OCC_SYSLOG_PORT:-15141}:${OCC_SYSLOG_PORT:-15141}/udp"
    depends_on:
      redis:
        condition: service_healthy
    # Writable log volume for `OCC_LOG_FILE`; everything else is read-only. The
    # mount point itself is root-owned (Docker does not carry the image
    # directory's ownership onto the volume root), but the `logs/` directory
    # inside it is copied from the image with the runtime UID/GID, so the
    # unprivileged process can write there without a privileged init step.
    volumes:
      - correlator-logs:/var/log/opencanary-correlator
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  redis-data:
  correlator-logs:
