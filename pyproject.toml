[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "opencanary-correlator"
dynamic = ["version"]
description = "Stateless asyncio correlator for OpenCanary honeypot events"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Thinkst Applied Research", email = "info@thinkst.com" }]
maintainers = [{ name = "opencanary-correlator fork maintainers" }]
keywords = ["opencanary", "honeypot", "correlation", "security", "siem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "redis>=5.1,<7",
    "httpx>=0.27,<1",
    "aiosmtplib>=5.1.2,<6",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
# Attacker-IP enrichment reads DB-IP Lite (or GeoLite2) MMDB files locally, so the
# reader is an extra: a deployment without `OCC_GEOIP_CITY_DB` does not install it.
geo = [
    "maxminddb>=2.6,<3",
]
dev = [
    "fakeredis>=2.26",
    # fakeredis needs a Lua runtime to execute the atomic incident/lock
    # scripts, exactly as a real Redis server does in production.
    "lupa>=2.5",
    # The geo extra is only needed in production, but mypy checks that import and
    # the Docker-free test path needs the same dependency resolution.
    "maxminddb>=2.6,<3",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
opencanary-correlator = "opencanary_correlator.cli:main"

[project.urls]
Repository = "https://github.com/dyussekeyev/opencanary-correlator"
Upstream = "https://github.com/thinkst/opencanary-correlator"

[tool.uv]
# Keep CI, the Docker builder and the lockfile on the same resolver release.
required-version = "==0.13.0"

[tool.hatch.version]
path = "src/opencanary_correlator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opencanary_correlator"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    "Dockerfile",
    "docker-compose.yml",
    "compose.yaml",
    ".env.example",
    ".dockerignore",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "S",     # bandit
    "B",     # bugbear
    "A",     # builtins shadowing
    "ASYNC", # async pitfalls
    "RUF",   # ruff-specific
    "ANN",   # annotations
]
ignore = [
    "ANN401", # dynamically typed payloads are inherent to honeypot logdata
    "RUF001", # homoglyphs in alert templates are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "ANN001",
    "ANN003",
    "ANN201",
    "ANN401",
    "S105",
    "S106",
    "ASYNC109",
]

[tool.ruff.lint.isort]
known-first-party = ["opencanary_correlator"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config --cov --cov-report=term-missing:skip-covered"
markers = [
    "integration: tests that bind sockets or exercise the full stack",
    "linux: tests that only make sense on POSIX (signals, socket semantics)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]
