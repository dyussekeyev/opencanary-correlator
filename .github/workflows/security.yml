name: Security audit

# The lockfile is frozen, so the dependency *set* only changes when somebody
# changes it. Advisories against it appear on their own clock, which is why this
# runs on a schedule: a pinned version that was clean at commit time can be
# vulnerable a month later, and `ci.yml` only notices at the next push.
#
# GitHub runs a scheduled workflow from the default branch only, so this audits
# `master` and its `uv.lock`; a release branch is audited by the pull request
# that updates it. GitHub also disables a scheduled workflow after 60 days of
# repository inactivity, and re-enables it from the web UI or the next push.
on:
  schedule:
    # Mondays, 05:00 UTC, before the working day starts.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_PYTHON_DOWNLOADS: "never"
  UV_FROZEN: "1"

jobs:
  audit:
    name: Locked dependencies against published advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Check the lockfile
        run: uv lock --check
      # Same invocation as `ci.yml`: audits the exact locked set, not the
      # resolver's view, so a published advisory against a pinned version fails.
      - name: Audit the locked set
        run: |
          uv export --frozen --no-hashes --no-emit-project --extra dev > /tmp/requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/requirements.txt --progress-spinner off
