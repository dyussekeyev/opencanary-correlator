name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_PYTHON_DOWNLOADS: "never"
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Check the lockfile
        run: uv lock --check
      - name: Install the locked environment
        run: uv sync --extra dev --python "$(command -v python)"
      - name: Dependency consistency
        run: uv pip check
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tools

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      OCC_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --extra dev --python "$(command -v python)"
      - name: Pytest
        run: uv run pytest

  # Records numbers, never gates on them: two invocations of one commit
  # measured 5.145 s and 12.040 s for the same workload, because a shared
  # runner's CPU steal, not the code, dominates the wall time.
  benchmark:
    name: Benchmark (hot incident, native loopback)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --extra dev --python "$(command -v python)"
      # A native server on the runner, not a service container: the point of
      # this job is to separate Redis round-trip cost from the workload, and a
      # container network would smuggle the Docker daemon's latency back in.
      - name: Start a native Redis server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          if ! redis-cli ping >/dev/null 2>&1; then
            redis-server --port 6379 --save '' --appendonly no --daemonize yes
          fi
          for _ in $(seq 1 50); do
            if redis-cli ping >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          redis-cli ping
      - name: Measure the loopback round trip
        run: |
          # `-q` separates progress lines with a bare carriage return, so the
          # output is normalised before anything matches against it.
          redis-benchmark -t ping -n 20000 -c 1 -q | tr '\r' '\n' | tee /tmp/ping.txt
          grep 'requests per second' /tmp/ping.txt || true
      - name: Hot incident, 10,000 events from one host
        run: |
          uv run python tools/bench_ingest.py --redis-url redis://localhost:6379/15 \
            --events 10000 --hosts 1 --concurrency 1 | tee /tmp/hot.json
      - name: Baseline, 10,000 events over 100 hosts
        run: |
          uv run python tools/bench_ingest.py --redis-url redis://localhost:6379/15 \
            --events 10000 --hosts 100 --concurrency 8 | tee /tmp/many.json
      - name: Summarise
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          print("### Native runner measurements")
          print()
          ping_file = pathlib.Path("/tmp/ping.txt")
          ping = ping_file.read_text() if ping_file.exists() else ""
          rps_line = next(
              (line for line in ping.splitlines() if "requests per second" in line), ""
          )
          rtt = ""
          if rps_line:
              rate = float(rps_line.split()[1])
              rtt = f"{1000 / rate:.4f} ms"
          print(f"Loopback round trip: **{rtt or 'not measured'}** (`{rps_line}`)")
          print()
          print("| Workload | Elapsed | events/s | accepted | dropped | incidents | ms/event |")
          print("|---|---|---|---|---|---|---|")
          for label, path in (("1 host, 1 lane", "/tmp/hot.json"), ("100 hosts, 8 lanes", "/tmp/many.json")):
              file = pathlib.Path(path)
              if not file.exists():
                  print(f"| {label} | missing | | | | | |")
                  continue
              data = json.loads(file.read_text())
              per_event = data["elapsed_seconds"] * 1000 / data["events"] if data["events"] else 0
              print(
                  f"| {label} | {data['elapsed_seconds']} s | {data['events_per_second']} | "
                  f"{data['accepted']} | {data['dropped']} | {data['incidents']} | {per_event:.3f} |"
              )
          PY

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Install the wheel and smoke the CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          opencanary-correlator --version
          OCC_REDIS_URL=redis://localhost:6379/0 opencanary-correlator --check-config > /tmp/occ-config.json
          python -c "import json, pathlib; payload = json.loads(pathlib.Path('/tmp/occ-config.json').read_text()); assert payload['redis_url'] == 'redis://localhost:6379/0'; assert 'channels' in payload"

  docker:
    name: Docker build and compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start Redis and the correlator
        run: docker compose up -d --build --wait
      - name: Send a SocketJSONHandler event
        run: |
          python3 - <<'PY'
          import json
          import socket

          event = {
              "src_host": "10.0.0.5",
              "src_port": 4444,
              "dst_host": "10.0.0.2",
              "dst_port": 21,
              "logtype": 2000,
              "node_id": "ci-canary",
              "local_time": "2026-10-24 10:00:00.000000",
              "logdata": {"USERNAME": "admin", "PASSWORD": "ci"},
          }
          with socket.create_connection(("127.0.0.1", 1514), timeout=10) as connection:
              connection.sendall((json.dumps(event) + "\n").encode("utf-8"))
          PY
      - name: Verify the Prometheus endpoint
        run: |
          metrics=""
          for _ in $(seq 1 15); do
            metrics=$(docker compose exec -T correlator python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/metrics', timeout=5).read().decode())")
            if printf '%s\n' "$metrics" | grep -q '^opencanary_events_total'; then
              break
            fi
            sleep 1
          done
          printf '%s\n' "$metrics" | grep -q '^opencanary_build_info'
          printf '%s\n' "$metrics" | grep -q '^opencanary_events_total'
          printf '%s\n' "$metrics" | grep -q '^# TYPE opencanary_events_total counter'
      - name: Verify the incident, audit trail and runtime user
        run: |
          count=""
          for _ in $(seq 1 30); do
            count=$(docker compose exec -T redis redis-cli ZCARD incidents | tr -d '\r')
            if [ "$count" = "1" ]; then
              break
            fi
            sleep 1
          done
          echo "incident count: $count"
          test "$count" = "1"
          docker compose exec -T redis redis-cli ZRANGE incidents 0 -1 | tr -d '\r' | grep -q '^incident:ftplogin:10\.0\.0\.5:'
          docker compose logs correlator | grep -q '"action":"startup"'
          docker compose exec -T correlator python -c 'import os; raise SystemExit(0 if os.getuid() == 10001 else 1)'
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q correlator)")" = "healthy"
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans
