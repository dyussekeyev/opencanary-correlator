name: CI

on:
  push:
    # `release/**` is included so a direct push to a release branch is checked
    # too, not only the pull request into it.
    branches: [master, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_PYTHON_DOWNLOADS: "never"
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Check the lockfile
        run: uv lock --check
      - name: Install the locked environment
        run: uv sync --extra dev --python "$(command -v python)"
      - name: Dependency consistency
        run: uv pip check
      # Audits the exact locked set, not the resolver's view, so a published
      # advisory against a pinned version fails the build.
      - name: Known-vulnerability audit of the locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --extra dev > /tmp/requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/requirements.txt --progress-spinner off
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tools

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The coverage comment needs to write to the pull request; everything else
    # in this job stays read-only. Pull requests from forks get a read-only
    # token regardless, so that step is skipped for them (see `if:` below).
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      OCC_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --extra dev --python "$(command -v python)"
      - name: Pytest
        run: uv run pytest
      # The overall 85% gate in pyproject can hide gaps in the critical packages,
      # so they get their own floor. Reads the .coverage data written by the run above.
      - name: Critical-module coverage floor (core, storage, receivers)
        run: uv run coverage report --include="*/core/*,*/storage/*,*/connectors/receivers/*" --fail-under=90
      # One matrix entry publishes the report: four identical XML files would
      # only clutter the artifacts and race on the same pull-request comment.
      - name: Write the coverage report
        if: matrix.python-version == '3.13'
        run: uv run coverage xml -o coverage.xml
      - name: Keep the coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30
      - name: Summarise coverage in the pull request
        # Fork pull requests run with a read-only token, so a comment would fail
        # there; the artifact above is still uploaded.
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- opencanary-coverage -->';
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            // The first `>` closes the `<?xml ...?>` declaration, so the root
            // element has to be located explicitly.
            const start = xml.indexOf('<coverage');
            const root = xml.slice(start, xml.indexOf('>', start));
            const attr = (name) => Number(root.match(new RegExp(name + '="([0-9.]+)"'))[1]);
            const percent = (covered, total) => (total ? (covered / total) * 100 : 0).toFixed(2);

            const linesCovered = attr('lines-covered');
            const linesValid = attr('lines-valid');
            const branchesCovered = attr('branches-covered');
            const branchesValid = attr('branches-valid');
            const combined = percent(
              linesCovered + branchesCovered,
              linesValid + branchesValid,
            );

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Coverage',
              '',
              '| Metric | Covered | Total | % |',
              '|---|---|---|---|',
              `| Lines | ${linesCovered} | ${linesValid} | ${percent(linesCovered, linesValid)} |`,
              `| Branches | ${branchesCovered} | ${branchesValid} | ${percent(branchesCovered, branchesValid)} |`,
              `| **Combined** | | | **${combined}** |`,
              '',
              'Gates in this run: 85 % overall, 90 % for `core`, `storage` and `connectors/receivers`.',
              `[Download the XML report](${runUrl}) — the artifact is kept for 30 days.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # The Linux matrix cannot exercise the Windows code paths the package ships:
  # CRLF in alerts and logs, the pidfile handling, and the Windows datagram
  # transport. Service containers are not available on Windows runners, so the
  # opt-in real-Redis tests skip here and stay covered by the Ubuntu matrix.
  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install the locked environment
        shell: bash
        run: uv sync --extra dev --python "$(command -v python)"
      - name: Pytest
        shell: bash
        run: uv run pytest

  # Records numbers, never gates on them: two invocations of one commit
  # measured 5.145 s and 12.040 s for the same workload, because a shared
  # runner's CPU steal, not the code, dominates the wall time.
  benchmark:
    name: Benchmark (hot incident, native loopback)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --extra dev --python "$(command -v python)"
      # A native server on the runner, not a service container: the point of
      # this job is to separate Redis round-trip cost from the workload, and a
      # container network would smuggle the Docker daemon's latency back in.
      - name: Start a native Redis server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          if ! redis-cli ping >/dev/null 2>&1; then
            redis-server --port 6379 --save '' --appendonly no --daemonize yes
          fi
          for _ in $(seq 1 50); do
            if redis-cli ping >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          redis-cli ping
      - name: Measure the loopback round trip
        run: |
          # `-q` separates progress lines with a bare carriage return, so the
          # output is normalised before anything matches against it.
          redis-benchmark -t ping -n 20000 -c 1 -q | tr '\r' '\n' | tee /tmp/ping.txt
          grep 'requests per second' /tmp/ping.txt || true
      # Server latency while the server is being hammered, which nothing else
      # measured: `redis-benchmark` above reports the throughput of its own closed
      # loop, not what a second client waits for. The probe brackets both runs in
      # one step so it outlives the workloads it measures.
      - name: Server latency, idle and under the ingestion load
        run: |
          uv run python tools/latency_probe.py --redis-url redis://localhost:6379/15 \
            --duration 5 | tee /tmp/latency-idle.json
          uv run python tools/latency_probe.py --redis-url redis://localhost:6379/15 \
            --duration 300 > /tmp/latency-load.json &
          probe=$!
          trap 'kill -TERM "$probe" 2>/dev/null || true' EXIT
          # One interval of preamble, so the first samples are not the start-up
          # cost of the benchmark rather than the load being measured.
          sleep 1
          uv run python tools/bench_ingest.py --redis-url redis://localhost:6379/15 \
            --events 10000 --hosts 1 --concurrency 1 | tee /tmp/hot.json
          uv run python tools/bench_ingest.py --redis-url redis://localhost:6379/15 \
            --events 10000 --hosts 100 --concurrency 8 | tee /tmp/many.json
          kill -TERM "$probe"
          wait "$probe" || true
          trap - EXIT
          # Also in the log, not only in the step summary, so the figure can be
          # read without the web UI.
          echo "--- latency, under load:"
          cat /tmp/latency-load.json
      # Attribute the in-process cost: parsing, validation and fingerprinting
      # have no I/O, so this number is comparable across machines.
      - name: Profile the pure-Python path
        run: |
          uv run python tools/profile_hot_path.py cpu --iterations 20000 | tee /tmp/cpu.json
      - name: Profile the engine, one new incident per event
        run: |
          uv run python tools/profile_hot_path.py pipeline \
            --redis-url redis://localhost:6379/15 --events 2000 | tee /tmp/pipe-new.json
      - name: Profile the engine, hot merge into one incident
        run: |
          uv run python tools/profile_hot_path.py pipeline \
            --redis-url redis://localhost:6379/15 --events 2000 --hosts 1 | tee /tmp/pipe-hot.json
      # The parser/decoding/script question, answered by paired differences
      # instead of single-run means that bounce by the size of the effect.
      - name: Compare command paths
        run: |
          uv run python tools/profile_hot_path.py commands \
            --redis-url redis://localhost:6379/15 --iterations 1000 | tee /tmp/cmd.json
      - name: Summarise
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          print("### Native runner measurements")
          print()
          ping_file = pathlib.Path("/tmp/ping.txt")
          ping = ping_file.read_text() if ping_file.exists() else ""
          rps_line = next(
              (line for line in ping.splitlines() if "requests per second" in line), ""
          )
          rtt = ""
          if rps_line:
              rate = float(rps_line.split()[1])
              rtt = f"{1000 / rate:.4f} ms"
          print(f"Loopback round trip: **{rtt or 'not measured'}** (`{rps_line}`)")
          print()
          print("| Workload | Elapsed | events/s | accepted | dropped | incidents | ms/event |")
          print("|---|---|---|---|---|---|---|")
          for label, path in (("1 host, 1 lane", "/tmp/hot.json"), ("100 hosts, 8 lanes", "/tmp/many.json")):
              file = pathlib.Path(path)
              if not file.exists():
                  print(f"| {label} | missing | | | | | |")
                  continue
              data = json.loads(file.read_text())
              per_event = data["elapsed_seconds"] * 1000 / data["events"] if data["events"] else 0
              print(
                  f"| {label} | {data['elapsed_seconds']} s | {data['events_per_second']} | "
                  f"{data['accepted']} | {data['dropped']} | {data['incidents']} | {per_event:.3f} |"
              )

          def load(path):
              file = pathlib.Path(path)
              if not file.exists():
                  return None
              text = file.read_text()
              return json.loads(text[: text.rindex("}") + 1])

          latency_idle = pathlib.Path("/tmp/latency-idle.json")
          latency_load = pathlib.Path("/tmp/latency-load.json")
          if latency_idle.exists() and latency_load.exists():
              idle = json.loads(latency_idle.read_text())["rtt_us"]
              loaded = json.loads(latency_load.read_text())["rtt_us"]
              print()
              print("### Redis server latency, PING from a second client")
              print()
              print("| Phase | samples | p50 | p95 | p99 | max |")
              print("|---|---|---|---|---|---|")
              for label, data in (("idle", idle), ("while ingesting", loaded)):
                  print(
                      f"| {label} | {data['samples']} | {data['p50_us']} us |"
                      f" {data['p95_us']} us | {data['p99_us']} us | {data['max_us']} us |"
                  )
              if idle["p99_us"] is not None and loaded["p99_us"] is not None:
                  delta = loaded["p99_us"] - idle["p99_us"]
                  verdict = "within" if delta < 2000 else "ABOVE"
                  print()
                  print(f"p99 change under load: **{delta:+.1f} us** ({verdict} the 2 ms criterion)")

          print()
          print("### Resident memory (process RSS)")
          print()
          print("| Workload | before | after | peak |")
          print("|---|---|---|---|")
          for label, path in (("1 host, 1 lane", "/tmp/hot.json"), ("100 hosts, 8 lanes", "/tmp/many.json")):
              data = load(path)
              if not data or "rss_mib" not in data:
                  print(f"| {label} | missing | | |")
                  continue
              rss = data["rss_mib"]
              print(
                  f"| {label} | {rss['before']} MiB | {rss['after']} MiB | **{rss['peak']} MiB** |"
              )

          cpu = load("/tmp/cpu.json")
          if cpu:
              print()
              print("### Where the in-process time goes")
              print()
              print("| Stage | mean | p95 |")
              print("|---|---|---|")
              for stage, values in cpu["stages_us"].items():
                  print(f"| `{stage}` | {values['mean_us']} us | {values['p95_us']} us |")
              print(f"| **total Python** | **{cpu['cpu_per_event_us']} us** | |")
              print()
              print("Top functions by own time per event:")
              print()
              print("| Function | own us | cum us |")
              print("|---|---|---|")
              for entry in cpu["top_functions"][:8]:
                  name = ":".join(str(part) for part in entry["function"][-2:])
                  print(
                      f"| `{name}` | {entry['tottime_us_per_event']} |"
                      f" {entry['cumtime_us_per_event']} |"
                  )
              print()
              print("### Merge into a capped incident (pure Python, per call)")
              print()
              print("| Stage | mean | p95 |")
              print("|---|---|---|")
              for stage, values in cpu["merge_stages_us"].items():
                  print(f"| `{stage}` | {values['mean_us']} us | {values['p95_us']} us |")

          for label, path in (("new incident per event", "/tmp/pipe-new.json"), ("hot merge", "/tmp/pipe-hot.json")):
              data = load(path)
              if not data:
                  continue
              cost = data["cost_us_per_event"]
              share = data["share_pct"]
              print()
              print(f"### Pipeline cost, {label}")
              print()
              print(
                  f"handle_event **{cost['handle_event']} us** = CPU"
                  f" {cost['measured_cpu_parse_validate_fingerprint']} us ({share['cpu']}%)"
                  f" + {data['redis']['round_trips_per_event']} round trips"
                  f" ({cost['estimated_round_trips_x_ping']} us, {share['round_trips_x_ping']}%)"
                  f" + {cost['residual_event_loop_and_protocol']} us residual ({share['residual']}%)"
              )
              print()
              print(
                  "| Command | per event |\n|---|---|\n"
                  + "\n".join(
                      f"| `{command}` | {count} |"
                      for command, count in data["redis"]["command_mix_per_event"].items()
                  )
              )

          commands = load("/tmp/cmd.json")
          if commands:
              print()
              print("### Command paths, median of interleaved differences")
              print()
              print(f"`hiredis` installed: {commands['hiredis_available']}")
              print()
              print("| Comparison (positive = second call is slower) | median | p25 | p75 |")
              print("|---|---|---|---|")
              for label, values in commands["paired_deltas_us"].items():
                  print(
                      f"| {label} | {values['median_us']} us | {values['p25_us']} us |"
                      f" {values['p75_us']} us |"
                  )
          PY

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Install the wheel and smoke the CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          opencanary-correlator --version
          OCC_REDIS_URL=redis://localhost:6379/0 opencanary-correlator --check-config > /tmp/occ-config.json
          python -c "import json, pathlib; payload = json.loads(pathlib.Path('/tmp/occ-config.json').read_text()); assert payload['redis_url'] == 'redis://localhost:6379/0'; assert 'channels' in payload"

  docker:
    name: Docker build and compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Redis password for this job
        run: |
          # Random per run, written to GITHUB_ENV so every later compose step sees
          # it (compose refuses to start without it). Never printed.
          echo "OCC_REDIS_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start Redis and the correlator
        run: docker compose up -d --build --wait
      - name: Send a SocketJSONHandler event
        run: |
          python3 - <<'PY'
          import json
          import socket

          event = {
              "src_host": "10.0.0.5",
              "src_port": 4444,
              "dst_host": "10.0.0.2",
              "dst_port": 21,
              "logtype": 2000,
              "node_id": "ci-canary",
              "local_time": "2026-10-24 10:00:00.000000",
              "logdata": {"USERNAME": "admin", "PASSWORD": "ci"},
          }
          with socket.create_connection(("127.0.0.1", 15140), timeout=10) as connection:
              connection.sendall((json.dumps(event) + "\n").encode("utf-8"))
          PY
      - name: Verify the Prometheus endpoint
        run: |
          metrics=""
          for _ in $(seq 1 15); do
            metrics=$(docker compose exec -T correlator python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:15142/metrics', timeout=5).read().decode())")
            if printf '%s\n' "$metrics" | grep -q '^opencanary_events_total'; then
              break
            fi
            sleep 1
          done
          printf '%s\n' "$metrics" | grep -q '^opencanary_build_info'
          printf '%s\n' "$metrics" | grep -q '^opencanary_events_total'
          printf '%s\n' "$metrics" | grep -q '^# TYPE opencanary_events_total counter'
      - name: Verify the incident, audit trail and runtime user
        run: |
          count=""
          for _ in $(seq 1 30); do
            count=$(docker compose exec -T redis redis-cli ZCARD incidents | tr -d '\r')
            if [ "$count" = "1" ]; then
              break
            fi
            sleep 1
          done
          echo "incident count: $count"
          test "$count" = "1"
          docker compose exec -T redis redis-cli ZRANGE incidents 0 -1 | tr -d '\r' | grep -q '^incident:ftplogin:10\.0\.0\.5:'
          docker compose logs correlator | grep -q '"action":"startup"'
          docker compose exec -T correlator python -c 'import os; raise SystemExit(0 if os.getuid() == 10001 else 1)'
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q correlator)")" = "healthy"
      - name: Publish the intake on loopback only
        run: |
          # The default must keep the canary on this host safe: the published port
          # is bound to 127.0.0.1, not to every interface. Print what compose
          # actually bound instead of trusting the file.
          for mapping in 15140 15141; do
            bound=$(docker compose port correlator "$mapping" | head -n 1 | tr -d '\r')
            echo "$mapping -> $bound"
            test "$bound" = "127.0.0.1:$mapping"
          done
          # Widening stays one variable away. `docker compose port` reports the
          # mapping of the container that is already running, so it cannot show
          # what a changed variable would produce; the rendered configuration
          # can, and that is what the next `up` would create.
          default_ips=$(docker compose config | grep -c 'host_ip: 127.0.0.1')
          # One variable per protocol family: the syslog mapping has its own.
          widened_ips=$(
            OCC_TCP_PUBLISH_HOST=0.0.0.0 OCC_SYSLOG_PUBLISH_HOST=0.0.0.0 \
              docker compose config | grep -c 'host_ip: 0.0.0.0'
          )
          echo "loopback bindings: $default_ips, widened bindings: $widened_ips"
          test "$default_ips" = "3"
          test "$widened_ips" = "3"
      - name: Keep the container healthy with a loopback-only listener
        env:
          OCC_HEALTH_HOST: 127.0.0.1
        run: |
          # The health port is not published by the base file, so publish it here:
          # with a loopback-only listener the mapping must stay unreachable while
          # the in-container HEALTHCHECK still reports healthy.
          cat > /tmp/health-loopback.yml <<'YAML'
          services:
            correlator:
              ports:
                - "127.0.0.1:18080:15142"
          YAML
          compose=(docker compose -f docker-compose.yml -f /tmp/health-loopback.yml)
          "${compose[@]}" up -d --no-deps --force-recreate correlator
          status=""
          for _ in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$("${compose[@]}" ps -q correlator)")
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          echo "health with OCC_HEALTH_HOST=${OCC_HEALTH_HOST}: $status"
          test "$status" = "healthy"
          # The listener answers on loopback inside the container ...
          "${compose[@]}" exec -T correlator python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:15142/healthz', timeout=5).status)"
          # ... and is not bound to the container interface, so the published port
          # cannot reach it. This is what a wildcard binding would have allowed.
          if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=5)" 2>/dev/null; then
            echo "the published port reached a listener that should be loopback-only"
            exit 1
          fi
          echo "published port refused, as expected for a loopback-only binding"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans
